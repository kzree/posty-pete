[package]
name = "posty-pete"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = [
  "font-kit",
] }
gpui-component = { version = "0.9", features = [
  "tree-sitter",            # json
  "tree-sitter-html",
  "tree-sitter-css",
  "tree-sitter-javascript",
  "tree-sitter-yaml",
] }
gpui-kit-assets = "0.9"
mime = "0.3"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "multipart",
  "cookies",
  "gzip",
  "brotli",
  "rustls",
  "stream",
  "query",
  "form",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
