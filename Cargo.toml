[package]
name = "posty-pete"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = [
  "font-kit",
] }
gpui-component = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "multipart",
  "cookies",
  "gzip",
  "brotli",
  "rustls",
  "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
