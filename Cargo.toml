[workspace]
members = [".", "crates/domain"]
default-members = [".", "crates/domain"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "posty-pete"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { package = "posty-domain", path = "crates/domain" }
chrono.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = [
  "font-kit",
] }
gpui-component = { version = "0.9", features = [
  "tree-sitter",            # json
  "tree-sitter-html",
  "tree-sitter-css",
  "tree-sitter-javascript",
  "tree-sitter-yaml",
] }
gpui-kit-assets = "0.9"
gpui-router = { version = "0.7", default-features = false, features = ["gpui-pre"] }
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"

[dev-dependencies]
domain = { package = "posty-domain", path = "crates/domain", features = ["test-support"] }
